[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blog.jonghyeon.me-jonghyeon.me-embed-feed"
version = "0.1.0"
description = "Static embed feed builder for blog.jonghyeon.me"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
build = "src.build:main"

[tool.setuptools]
packages = ["src"]

[tool.uv]
package = true
